<style>
      .shimmer {
        background: linear-gradient(
          90deg,
          rgba(229, 225, 218, 0.3) 25%,
          rgba(229, 225, 218, 0.8) 50%,
          rgba(229, 225, 218, 0.3) 75%
        );
        background-size: 200% 100%;
        animation: shimmer-anim 2s infinite linear;
      }
      
      @keyframes shimmer-anim {
        from { background-position: -200% 0; }
        to { background-position: 200% 0; }
      }

      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }

      .logo-fade-in {
        animation: fadeInScale 1.2s ease-out forwards;
      }

      @keyframes fadeInScale {
        0% { opacity: 0; transform: scale(0.95); }
        100% { opacity: 1; transform: scale(1); }
      }

      .pulse-soft {
        animation: pulseSoft 3s ease-in-out infinite;
      }

      @keyframes pulseSoft {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }

      .progress-bar-loading {
        width: 0%;
        animation: progressMove 4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }

      @keyframes progressMove {
        0% { width: 0%; }
        10% { width: 30%; }
        60% { width: 70%; }
        100% { width: 92%; }
      }
    </style>

<script>
        // Micro-interaction: Randomly "complete" a skeleton section's fade to simulate partial load
        document.addEventListener('DOMContentLoaded', () => {
            const shimmers = document.querySelectorAll('.shimmer');
            
            // Simulating chunks of data coming in by slightly altering opacity of background elements
            setInterval(() => {
                const randomIndex = Math.floor(Math.random() * shimmers.length);
                const item = shimmers[randomIndex];
                item.style.transition = 'opacity 1.5s ease-in-out';
                item.style.opacity = Math.random() > 0.5 ? '0.2' : '0.4';
            }, 1000);

            // Optional: Redirect or transition to main app after pseudo-loading
            // setTimeout(() => { window.location.href = '#'; }, 4500);
        });
    </script>
